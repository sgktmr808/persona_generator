<style>
  :root {
    color-scheme: light dark;
    --bg: #0d0e14;
    --bg-elevated: #16171f;
    --border: rgba(255,255,255,0.12);
    --text: #f2f2f5;
    --text-dim: rgba(242,242,245,0.6);
    --accent: #7c83ff;
    --accent-2: #36c6ff;
    --accent-grad: linear-gradient(135deg, #7c83ff 0%, #36c6ff 100%);
    --danger: #ff5a5a;
    --ok: #4ade80;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f5f8;
      --bg-elevated: #ffffff;
      --border: rgba(0,0,0,0.12);
      --text: #16171f;
      --text-dim: rgba(22,23,31,0.6);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }
  body {
    padding-top: max(12px, env(safe-area-inset-top, 0px));
    padding-right: env(safe-area-inset-right, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-bottom: 0;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 16px 16px calc(96px + env(safe-area-inset-bottom, 0px));
  }
  h1 { font-size: 18px; margin: 8px 0 4px; }
  .sub { font-size: 13px; color: var(--text-dim); margin: 0 0 16px; line-height: 1.5; }
  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
  }
  textarea {
    width: 100%;
    min-height: 140px;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    font-size: 16px;
    line-height: 1.5;
    resize: vertical;
    font-family: inherit;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  button {
    -webkit-appearance: none;
    appearance: none;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 15px;
    cursor: pointer;
    min-height: 44px;
    touch-action: manipulation;
    transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
  }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent-grad); color: #fff; border-color: transparent; font-weight: 600; }
  button.flash-ok { background: var(--accent-grad) !important; color: #fff !important; border-color: transparent !important; }
  button.flash-err { background: rgba(255,90,90,0.18) !important; color: var(--danger) !important; border-color: rgba(255,90,90,0.5) !important; }
  .grow { flex: 1; }
  #viewer { display: none; }
  .nav-bar { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }
  .nav-bar .count { font-size: 14px; color: var(--text-dim); white-space: nowrap; }
  .prompt-box {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    font-size: 16px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 160px;
    -webkit-user-select: text;
    user-select: text;
  }
  /* 親指が届く画面下部に主要操作を固定(6.3インチ級の縦長画面向け) */
  .bottom-bar {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    gap: 8px;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--bg-elevated);
    border-top: 1px solid var(--border);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    z-index: 10;
  }
  .bottom-bar.visible { display: flex; }
  .bottom-bar button { min-height: 48px; }
  .bottom-bar .nav-btn { flex: 0 0 48px; padding: 12px 0; font-size: 18px; }
  details { margin-top: 14px; }
  summary {
    cursor: pointer;
    font-size: 14px;
    color: var(--text-dim);
    padding: 8px 0;
  }
  pre.settings-json {
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    max-height: 320px;
    overflow: auto;
    margin: 8px 0;
  }
  .jump-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .jump-row input[type="number"] {
    width: 72px;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    font-size: 16px;
  }
  #status {
    font-size: 13px;
    color: var(--text-dim);
    min-height: 18px;
    margin-top: 10px;
  }
  .privacy {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.6;
    margin-top: 24px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Persona Generator</h1>
  <p class="sub">
    生成アプリ側の「全件+設定をコピー」でコピーした内容をここに貼り付けると、1件ずつ本文と設定値を取り出せます。
  </p>

  <div class="card">
    <textarea id="pasteArea" placeholder="ここに貼り付け(&lt;&lt;&lt;PCEXPORT v1 count=... で始まるテキスト)"></textarea>
    <div class="row">
      <button id="parseButton" class="primary grow" type="button">解析する</button>
      <button id="clearButton" type="button">クリア</button>
    </div>
    <div id="status"></div>
  </div>

  <div id="viewer">
    <div class="nav-bar">
      <span class="count"><span id="curNo">0</span> / <span id="totalNo">0</span></span>
    </div>

    <div id="promptBox" class="prompt-box"></div>

    <div class="jump-row">
      <label for="jumpInput" style="font-size:13px;color:var(--text-dim);">件番号へ移動</label>
      <input id="jumpInput" type="number" inputmode="numeric" min="1" />
      <button id="jumpButton" type="button">移動</button>
    </div>

    <details>
      <summary>設定値(JSON)を見る</summary>
      <pre id="settingsJson" class="settings-json"></pre>
    </details>
  </div>

  <p class="privacy">
    このページはサーバーを持たない静的サイトです。貼り付けた内容はこの端末のブラウザ内(localStorage)にのみ保存され、どこにも送信されません。共有リンクや同期機能はありません。
  </p>
</div>

<div class="bottom-bar" id="bottomBar">
  <button id="prevButton" class="nav-btn" type="button" aria-label="前へ">◀</button>
  <button id="copyPromptButton" class="primary grow" type="button">本文をコピー</button>
  <button id="copySettingsButton" class="grow" type="button">設定をコピー</button>
  <button id="nextButton" class="nav-btn" type="button" aria-label="次へ">▶</button>
</div>

<script>
(function () {
  "use strict";
  var STORAGE_KEY = "personaGenerator.lastBatch.v1";

  var pasteArea = document.getElementById("pasteArea");
  var parseButton = document.getElementById("parseButton");
  var clearButton = document.getElementById("clearButton");
  var statusEl = document.getElementById("status");
  var viewer = document.getElementById("viewer");
  var bottomBar = document.getElementById("bottomBar");
  var promptBox = document.getElementById("promptBox");
  var settingsJson = document.getElementById("settingsJson");
  var curNoEl = document.getElementById("curNo");
  var totalNoEl = document.getElementById("totalNo");
  var prevButton = document.getElementById("prevButton");
  var nextButton = document.getElementById("nextButton");
  var copyPromptButton = document.getElementById("copyPromptButton");
  var copySettingsButton = document.getElementById("copySettingsButton");
  var jumpInput = document.getElementById("jumpInput");
  var jumpButton = document.getElementById("jumpButton");

  var items = [];
  var index = 0;

  // app_static の「全件+設定をコピー」形式(<<<PROMPT NN>>> / <<<SETTINGS NN>>> / <<<PCEXPORT END>>>)を
  // 解析する。マーカーはあえて日本語の生成文にまず出現しない記号列にしてあるので、単純な位置分割で
  // 安全に切り出せる。
  function parseExport(text) {
    var markerRe = /<<<(?:PCEXPORT v1 count=(\d+)|PROMPT (\d+)|SETTINGS (\d+)|PCEXPORT END)>>>/g;
    var markers = [];
    var m;
    while ((m = markerRe.exec(text))) {
      var type, no;
      if (m[1] !== undefined) { type = "header"; no = Number(m[1]); }
      else if (m[2] !== undefined) { type = "prompt"; no = Number(m[2]); }
      else if (m[3] !== undefined) { type = "settings"; no = Number(m[3]); }
      else { type = "end"; }
      markers.push({ type: type, no: no, index: m.index, end: m.index + m[0].length });
    }
    if (!markers.some(function (mk) { return mk.type === "prompt"; })) {
      throw new Error("PROMPTブロックが見つかりません。生成アプリの「全件+設定をコピー」の内容をそのまま貼り付けてください。");
    }
    var map = {};
    for (var i = 0; i < markers.length; i++) {
      var cur = markers[i];
      if (cur.type !== "prompt" && cur.type !== "settings") continue;
      var bodyStart = cur.end;
      var bodyEnd = markers[i + 1] ? markers[i + 1].index : text.length;
      var body = text.slice(bodyStart, bodyEnd).replace(/^\n+/, "").replace(/\n+$/, "");
      var entry = map[cur.no] || { no: cur.no, prompt: "", settings: null, settingsRaw: "", settingsError: "" };
      if (cur.type === "prompt") {
        entry.prompt = body;
      } else {
        entry.settingsRaw = body;
        try { entry.settings = JSON.parse(body); } catch (e) { entry.settingsError = e.message; }
      }
      map[cur.no] = entry;
    }
    var nums = Object.keys(map).map(Number).sort(function (a, b) { return a - b; });
    return nums.map(function (n) { return map[n]; });
  }

  function saveToStorage() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ items: items, index: index, ts: Date.now() }));
    } catch (_) { /* 容量超過等は無視(表示は継続) */ }
  }

  function loadFromStorage() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      var parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.items) || !parsed.items.length) return false;
      items = parsed.items;
      index = typeof parsed.index === "number" ? parsed.index : 0;
      return true;
    } catch (_) { return false; }
  }

  function renderCurrent() {
    if (!items.length) { viewer.style.display = "none"; bottomBar.classList.remove("visible"); return; }
    if (index < 0) index = 0;
    if (index > items.length - 1) index = items.length - 1;
    var it = items[index];
    curNoEl.textContent = String(index + 1);
    totalNoEl.textContent = String(items.length);
    promptBox.textContent = it.prompt || "(本文なし)";
    if (it.settings) {
      settingsJson.textContent = JSON.stringify(it.settings, null, 1);
    } else if (it.settingsError) {
      settingsJson.textContent = "設定JSONの解析に失敗しました: " + it.settingsError + "\n\n" + (it.settingsRaw || "");
    } else {
      settingsJson.textContent = "(このプロンプトには設定データが含まれていません)";
    }
    viewer.style.display = "block";
    bottomBar.classList.add("visible");
    jumpInput.value = String(index + 1);
    jumpInput.max = String(items.length);
  }

  function flashButton(btn, ok) {
    if (btn._t) clearTimeout(btn._t);
    var original = btn.dataset.label || btn.textContent;
    btn.dataset.label = original;
    btn.textContent = original + (ok ? " ✓" : " ✗");
    btn.classList.toggle("flash-ok", ok);
    btn.classList.toggle("flash-err", !ok);
    btn._t = setTimeout(function () {
      btn.textContent = original;
      btn.classList.remove("flash-ok", "flash-err");
    }, 1300);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "readonly");
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      document.execCommand("copy");
      return Promise.resolve();
    } finally {
      ta.remove();
    }
  }

  parseButton.addEventListener("click", function () {
    var text = pasteArea.value;
    if (!text.trim()) { statusEl.textContent = "貼り付け欄が空です。"; return; }
    try {
      var parsed = parseExport(text);
      items = parsed;
      index = 0;
      saveToStorage();
      renderCurrent();
      statusEl.textContent = items.length + "件を読み込みました。";
      pasteArea.value = "";
    } catch (e) {
      statusEl.textContent = "解析失敗: " + e.message;
    }
  });

  clearButton.addEventListener("click", function () {
    pasteArea.value = "";
    items = [];
    index = 0;
    try { localStorage.removeItem(STORAGE_KEY); } catch (_) { /* noop */ }
    viewer.style.display = "none";
    bottomBar.classList.remove("visible");
    statusEl.textContent = "クリアしました。";
  });

  prevButton.addEventListener("click", function () { index -= 1; if (index < 0) index = items.length - 1; saveToStorage(); renderCurrent(); });
  nextButton.addEventListener("click", function () { index += 1; if (index > items.length - 1) index = 0; saveToStorage(); renderCurrent(); });

  jumpButton.addEventListener("click", function () {
    var n = parseInt(jumpInput.value, 10);
    if (!Number.isFinite(n)) return;
    index = Math.max(0, Math.min(items.length - 1, n - 1));
    saveToStorage();
    renderCurrent();
  });

  copyPromptButton.addEventListener("click", function () {
    if (!items.length) return;
    copyText(items[index].prompt || "").then(function () {
      flashButton(copyPromptButton, true);
    }).catch(function () {
      flashButton(copyPromptButton, false);
    });
  });

  copySettingsButton.addEventListener("click", function () {
    if (!items.length) return;
    var it = items[index];
    var text = it.settings ? JSON.stringify(it.settings, null, 1) : (it.settingsRaw || "");
    copyText(text).then(function () {
      flashButton(copySettingsButton, true);
    }).catch(function () {
      flashButton(copySettingsButton, false);
    });
  });

  // スワイプで前後移動(iPhoneでの片手操作向け)
  (function () {
    var startX = null, startY = null;
    promptBox.addEventListener("touchstart", function (e) {
      var t = e.changedTouches[0];
      startX = t.clientX; startY = t.clientY;
    }, { passive: true });
    promptBox.addEventListener("touchend", function (e) {
      if (startX === null) return;
      var t = e.changedTouches[0];
      var dx = t.clientX - startX, dy = t.clientY - startY;
      startX = null; startY = null;
      if (Math.abs(dx) < 60 || Math.abs(dy) > 80) return;
      if (dx < 0) nextButton.click(); else prevButton.click();
    }, { passive: true });
  })();

  if (loadFromStorage()) {
    renderCurrent();
    statusEl.textContent = "前回の続き(" + items.length + "件)を復元しました。";
  }
})();
</script>
</body>
</html>
